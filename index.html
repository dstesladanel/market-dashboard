<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>לוח שוק ההון החי</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700;900&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #0b0d10;
    --card: #15181d;
    --card-border: #23272e;
    --text: #f2f2f2;
    --text-dim: #9aa0a6;
    --accent: #ff7a30;
    --accent-dim: rgba(255, 122, 48, 0.15);
    --green: #23c07a;
    --red: #e5484d;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Heebo', sans-serif;
    direction: rtl;
  }
  body { padding-bottom: 60px; }
  header {
    padding: 28px 24px 18px;
    text-align: center;
    border-bottom: 1px solid var(--card-border);
    margin-bottom: 24px;
  }
  header .eyebrow {
    color: var(--accent);
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.5px;
    margin-bottom: 6px;
  }
  header h1 {
    margin: 0 0 8px;
    font-size: 28px;
    font-weight: 900;
  }
  header p {
    margin: 0;
    color: var(--text-dim);
    font-size: 14px;
  }
  main {
    max-width: 1100px;
    margin: 0 auto;
    padding: 0 20px;
  }
  .vix-strip {
    display: flex;
    justify-content: center;
    margin-bottom: 28px;
  }
  .vix-card {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 14px;
    padding: 14px 20px;
    display: flex;
    align-items: center;
    gap: 14px;
    max-width: 360px;
    width: 100%;
  }
  .vix-card .label {
    font-size: 13px;
    color: var(--text-dim);
    font-weight: 500;
  }
  .vix-card .name {
    font-weight: 700;
    font-size: 15px;
    margin-bottom: 2px;
  }
  section.panel {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 16px;
    padding: 18px;
    margin-bottom: 24px;
    overflow: hidden;
  }
  section.panel h2 {
    font-size: 16px;
    margin: 0 0 14px;
    font-weight: 700;
    color: var(--text);
  }
  .ticker-wrap {
    border-radius: 12px;
    overflow: hidden;
    margin-bottom: 24px;
  }
  form#leadForm {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 14px;
  }
  form#leadForm .field {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  form#leadForm label {
    font-size: 13px;
    color: var(--text-dim);
  }
  form#leadForm input {
    background: #0e1013;
    border: 1px solid var(--card-border);
    border-radius: 10px;
    padding: 12px 14px;
    color: var(--text);
    font-family: inherit;
    font-size: 14px;
    outline: none;
    transition: border-color 0.15s;
  }
  form#leadForm input:focus {
    border-color: var(--accent);
  }
  form#leadForm .submit-row {
    grid-column: 1 / -1;
    display: flex;
    align-items: center;
    gap: 14px;
    margin-top: 4px;
  }
  button#submitBtn {
    background: var(--accent);
    color: #1a0d03;
    border: none;
    border-radius: 10px;
    padding: 13px 28px;
    font-family: inherit;
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
    transition: opacity 0.15s;
  }
  button#submitBtn:disabled {
    opacity: 0.6;
    cursor: default;
  }
  #formMsg {
    font-size: 13px;
  }
  #formMsg.success { color: var(--green); }
  #formMsg.error { color: var(--red); }
  footer {
    text-align: center;
    color: var(--text-dim);
    font-size: 12px;
    margin-top: 30px;
  }
  @media (max-width: 700px) {
    form#leadForm { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

  <section class="panel">
    <h2>הצטרפו לקהילה שלי</h2>
    <form id="leadForm">
      <div class="field">
        <label for="name">שם מלא</label>
        <input type="text" id="name" name="name" required autocomplete="name" />
      </div>
      <div class="field">
        <label for="email">דוא"ל</label>
        <input type="email" id="email" name="email" required autocomplete="email" />
      </div>
      <div class="field">
        <label for="phone">טלפון</label>
        <input type="tel" id="phone" name="phone" required autocomplete="tel" placeholder="05X-XXXXXXX" />
      </div>
      <div class="submit-row">
        <button id="submitBtn" type="submit">הצטרפות</button>
        <span id="formMsg"></span>
      </div>
    </form>
  </section>

</main>

<footer>
  נתוני שוק באדיבות TradingView · עדכון בזמן אמת
</footer>

<script>
  // Replace with the deployed Google Apps Script Web App URL (see SETUP.md)
  const GOOGLE_SCRIPT_URL = "PASTE_YOUR_APPS_SCRIPT_URL_HERE";

  const form = document.getElementById('leadForm');
  const btn = document.getElementById('submitBtn');
  const msg = document.getElementById('formMsg');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    msg.textContent = '';
    msg.className = '';

    if (GOOGLE_SCRIPT_URL.includes('PASTE_YOUR_APPS_SCRIPT_URL_HERE')) {
      msg.textContent = 'טרם הוגדרה כתובת השמירה (ראו SETUP.md).';
      msg.className = 'error';
      return;
    }

    const name = document.getElementById('name').value.trim();
    const email = document.getElementById('email').value.trim();
    const phone = document.getElementById('phone').value.trim();

    if (!name || !email || !phone) {
      msg.textContent = 'נא למלא את כל השדות.';
      msg.className = 'error';
      return;
    }

    btn.disabled = true;
    btn.textContent = 'שולח...';

    try {
      await fetch(GOOGLE_SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ name, email, phone })
      });
      msg.textContent = 'תודה! נרשמת בהצלחה.';
      msg.className = 'success';
      form.reset();
    } catch (err) {
      msg.textContent = 'אירעה שגיאה בשליחה, נסו שוב.';
      msg.className = 'error';
    } finally {
      btn.disabled = false;
      btn.textContent = 'הצטרפות';
    }
  });
</script>
